    <text x="0" y="148" class="telemetry-label">DATABANKS</text>
    <text x="110" y="148" class="telemetry-val">14 Active Mission Repositories</text>

    <text x="0" y="170" class="telemetry-label">SYNTAX</text>
    <text x="110" y="170" class="telemetry-val">TypeScript, Python, C#, JavaScript, SQL</text>

    <text x="0" y="192" class="telemetry-label">FRAMEWORKS</text>
    <text x="110" y="192" class="telemetry-val">Next.js 15, FastAPI, .NET, Prisma, Docker</text>

    <text x="0" y="214" class="telemetry-label">DOMAIN</text>
    <text x="110" y="214" class="telemetry-val-highlight">Unlimited Void // High-Concurrency Logic</text>

    <!-- STATUS BAR -->
    <text x="0" y="240" class="telemetry-label">STATUS</text>
    <text x="110" y="240" font-family="'JetBrains+Mono', monospace" font-size="11.5" font-weight="700" fill="#00F5FF">
      [ ONLINE • SHIELDS 100% • SENSORS LOCKED ]
    </text>

    <!-- PALETTE DOTS -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="18" height="9" rx="2" fill="#050505" stroke="#30363d"/>
      <rect x="22" y="0" width="18" height="9" rx="2" fill="#ff5f56" />
      <rect x="44" y="0" width="18" height="9" rx="2" fill="#006d32" />
      <rect x="66" y="0" width="18" height="9" rx="2" fill="#26a641" />
      <rect x="88" y="0" width="18" height="9" rx="2" fill="#39d353" />
      <rect x="110" y="0" width="18" height="9" rx="2" fill="#57f287" />
      <rect x="132" y="0" width="18" height="9" rx="2" fill="#00e5ff" />
      <rect x="154" y="0" width="18" height="9" rx="2" fill="#58a6ff" />
      <rect x="176" y="0" width="18" height="9" rx="2" fill="#bc8cff" />
      <rect x="198" y="0" width="18" height="9" rx="2" fill="#f0f6fc" />
    </g>
  </g>
</svg>