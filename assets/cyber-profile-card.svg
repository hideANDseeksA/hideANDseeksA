<svg width="860" height="420" viewBox="0 0 860 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;display=swap');
      
      .bg { fill: #050811; stroke: #00F5FF; stroke-width: 1.5; rx: 12; }
      .grid-pattern { stroke: rgba(0, 245, 255, 0.05); stroke-width: 1; }
      .header-bar { fill: #0a1020; stroke: #00F5FF; stroke-width: 0.5; }
      
      .wordmark {
        font-family: 'JetBrains+Mono', monospace;
        font-weight: 800;
        font-size: 11.5px;
        fill: #00F5FF;
        letter-spacing: 0px;
        text-shadow: 0 0 8px rgba(0, 245, 255, 0.6);
      }
      
      .ascii-portrait {
        font-family: 'JetBrains+Mono', monospace;
        font-weight: 600;
        font-size: 11.5px;
        fill: #7ee787;
        line-height: 1.2;
      }
      
      .ascii-hair { fill: #e6edf3; }
      .ascii-face { fill: #58a6ff; }
      .ascii-eyes { fill: #00F5FF; font-weight: 800; filter: drop-shadow(0 0 4px #00F5FF); }
      .ascii-hands { fill: #388bfd; }
      .ascii-cloak { fill: #30363d; }
      
      .telemetry-label {
        font-family: 'JetBrains+Mono', monospace;
        font-weight: 700;
        font-size: 12.5px;
        fill: #00F5FF;
      }
      
      .telemetry-val {
        font-family: 'JetBrains+Mono', monospace;
        font-weight: 400;
        font-size: 12px;
        fill: #c9d1d9;
      }
      
      .telemetry-val-highlight {
        font-family: 'JetBrains+Mono', monospace;
        font-weight: 600;
        font-size: 12px;
        fill: #58a6ff;
      }
      
      .color-dot { rx: 3; }
      
      @keyframes eyeGlow {
        0%, 100% { fill: #00F5FF; filter: drop-shadow(0 0 6px #00F5FF); }
        50% { fill: #79c0ff; filter: drop-shadow(0 0 2px #58a6ff); }
      }
      
      .eye-pulse {
        animation: eyeGlow 2.5s infinite ease-in-out;
      }
      
      @keyframes borderPulse {
        0%, 100% { stroke: #00F5FF; }
        50% { stroke: #0088cc; }
      }
      
      .card-border {
        animation: borderPulse 4s infinite ease-in-out;
      }
    </style>
    
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="856" height="416" class="bg card-border" />
  
  <!-- Subtle Matrix Grid -->
  <line x1="2" y1="36" x2="858" y2="36" stroke="#00F5FF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="20" cy="19" r="5" fill="#ff5f56" />
  <circle cx="36" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="19" r="5" fill="#27c93f" />
  
  <text x="430" y="23" fill="#00F5FF" font-family="'JetBrains+Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">
    TERMINAL // CYBERNETIC ARCHITECT KERNEL v4.14
  </text>
  
  <!-- 3D WORDMARK HEADER -->
  <g transform="translate(30, 48)">
    <text x="0" y="12" class="wordmark">██╗  ██╗██╗██████╗ ███████╗ █████╗ ███╗   ██╗██████╗ ███████╗███████╗██╗  ██╗ █████╗ </text>
    <text x="0" y="24" class="wordmark">██║  ██║██║██╔══██╗██╔════╝██╔══██╗████╗  ██║██╔══██╗██╔════╝██╔════╝██║ ██╔╝██╔══██╗</text>
    <text x="0" y="36" class="wordmark">███████║██║██║  ██║█████╗  ███████║██╔██╗ ██║██║  ██║███████╗█████╗  █████═╝ ███████║</text>
    <text x="0" y="48" class="wordmark">██╔══██║██║██║  ██║██╔══╝  ██╔══██║██║╚██╗██║██║  ██║╚════██║██╔══╝  ██╔═██╗ ██╔══██║</text>
    <text x="0" y="60" class="wordmark">██║  ██║██║██████╔╝███████╗██║  ██║██║ ╚████║██████╔╝███████║███████╗██║ ╚██╗██║  ██║</text>
    <text x="0" y="72" class="wordmark" opacity="0.6">╚═╝  ╚═╝╚═╝╚═════╝ ╚══════╝╚═╝  ╚═╝╚═╝  ╚═══╝╚═════╝ ╚══════╝╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝</text>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="30" y1="135" x2="830" y2="135" stroke="#00F5FF" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- LEFT COLUMN: ASCII PORTRAIT (GOJO / DOMAIN EXPANSION) -->
  <g transform="translate(35, 150)" font-family="'JetBrains+Mono', monospace" font-size="11">
    <text x="0" y="12" class="ascii-hair">######%%%%##%%%%%%%%#%#########***</text>
    <text x="0" y="24" class="ascii-hair">###%%%%%%%%%%@%%###%%#@%%%%%%%%###</text>
    <text x="0" y="36" class="ascii-hair">%%%%%@@@%%%##%#%%#**##%%%%@@%%%%@@</text>
    <text x="0" y="48" class="ascii-face">%%@@@@@@#%######*###**#%%@@@@@@@@@</text>
    <text x="0" y="60" class="ascii-face">@@@@@@@@####*###*%###%*#%%%%@@@@@@</text>
    <text x="0" y="72" class="ascii-face">@@@@@@@%###*=##*###*###++%@%%@@@@@</text>
    <text x="0" y="84" class="ascii-face">@@@@@@@%*++=+#***-#*+*##=##@@@@@@@</text>
    <text x="0" y="96" class="ascii-face">@@@@@@@%=+++#++#+=+++**##%@@@@@@@@</text>
    <text x="0" y="108" class="ascii-face">@@@@@@@#+==#=:+#=+#=-+*+*@@@@@@@@@</text>
    <text x="0" y="120" class="ascii-eyes eye-pulse">@@@@@@@## [◉] -:-----:- [◉] @@@@@@</text>
    <text x="0" y="132" class="ascii-face">@@@@@@@## .-##-=#-=#=::###@@@@@@@@</text>
    <text x="0" y="144" class="ascii-face">@@@@@##+    #########:  -##@@@@@@@</text>
    <text x="0" y="156" class="ascii-face">@@@@##:     .##*+++##    :##@@@@@@</text>
    <text x="0" y="168" class="ascii-hands">@@@#+-       :=#++#-       +##@@@@</text>
    <text x="0" y="180" class="ascii-hands">%##+          .-#-           +#@@@</text>
    <text x="0" y="192" class="ascii-hands">%#-           .#-:            ###@</text>
    <text x="0" y="204" class="ascii-cloak">=              ::.             -#@</text>
    <text x="0" y="216" class="ascii-cloak">               ...##             -</text>
    <text x="0" y="228" class="ascii-cloak">              .....#              </text>
    <text x="0" y="240" class="ascii-cloak">              ..                  </text>
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="385" y1="145" x2="385" y2="395" stroke="#00F5FF" stroke-opacity="0.25" />

  <!-- RIGHT COLUMN: NEOFETCH SYSTEM TELEMETRY -->
  <g transform="translate(410, 150)">
    <text x="0" y="16" class="telemetry-label">PILOT</text>
    <text x="110" y="16" class="telemetry-val-highlight">Jhon Brayn Rafer</text>
    <text x="250" y="16" class="telemetry-val" fill="#8b949e">(hideANDseeksA)</text>

    <text x="0" y="38" class="telemetry-label">ROLE</text>
    <text x="110" y="38" class="telemetry-val">Cybernetic Architect &amp; Systems Engineer</text>

    <text x="0" y="60" class="telemetry-label">CORE HOST</text>
    <text x="110" y="60" class="telemetry-val">Orbital Command Node #7G [Subsystem 64]</text>

    <text x="0" y="82" class="telemetry-label">SHELL</text>
    <text x="110" y="82" class="telemetry-val">zsh 5.9 // PowerShell 7.4.x</text>

    <text x="0" y="104" class="telemetry-label">UPTIME</text>
